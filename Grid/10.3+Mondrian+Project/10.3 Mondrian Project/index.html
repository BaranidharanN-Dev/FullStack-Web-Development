<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    .container {
      display: grid;
      width: 748px;
      height: 748px;
      gap: 9px;
      background-color: black;
      grid-template-columns: 320px 410px 50px;
      grid-template-rows: 414px 295px 20px;

    }

    .red {
      height: 414px;
      width: 320px;
      background-color: #E72F24;
      grid-area: 1 / 1 / 1/ 1;
    }

    .white1 {
      height: 414px;
      width: 419px;
      background-color: white;
      grid-area: 1 / 2 / 1 / 2;

    }

    .white2 {
      height: 295px;
      width: 320px;
      background-color: rgb(160, 98, 98);
      grid-area: 2 / 1 / 2 / 1;
    }

    .white3 {
      height: 295px;
      width: 405px;
      background-color: rgb(188, 14, 14);
      grid-area: 2 / 2 / 2 / 2;
    }

    .white4 {
      height: 20px;
      width: 320px;
      background-color: rgb(79, 20, 99);
      grid-column-start: 1;
      grid-area: 3 / 1 / 3 / 1;
    }

    .yellow {
      height: 20px;
      width: 198px;
      background-color: yellow;
    }

    .greyblack {
      height: 20px;
      width: 198px;
      background-color: grey;
    }

    .yellowtray {
      display: flex;
      flex-direction: row;
      gap: 10px;
      grid-area: 3 / 2 / 4 / 3;
    }

    .whitex {
      height: 295px;
      width: 320px;
      background-color: white;
    }

    .column {
      display: flex;


      flex-direction: column;
      gap: 10px;
      grid-area: 2 / 3 / 3 / 4;
      background-color: black;






    }

    .orange {
      height: 155px;
      width: 50px;
      background-color: rgb(210, 127, 11);


    }

    .whitey {
      height: 155px;

      width: 50px;
      background-color: rgb(242, 246, 243);

    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="container">
    <div class="red"></div>
    <div class="white1"></div>
    <div class="white2"></div>
    <div class="whitex"></div>
    <div class="white3"></div>
    <div class="blue"></div>
    <div class="white4"></div>
    <div class="yellowtray">
      <div class="yellow"></div>
      <div class="greyblack"></div>
    </div>
    <div class="column">
      <div class="orange"></div>
      <div class="whitey"></div>
    </div>
  </div>

</body>

</html>
